<!-- /settings.html -->
<!-- Simple operator settings screen for shift behavior -->
<!-- Exists so managers can tune SLA and promo behavior without code changes -->
<!-- RELEVANT FILES: js/ops.js, js/app.js, index.html, precios.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Taquería El Apá - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body data-page="settings" class="bg-white text-gray-900 font-sans min-h-screen">
    <header class="sticky top-0 bg-white border-b border-gray-200 p-4 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold uppercase">Settings</h1>
            <p class="text-xs font-mono text-gray-500">Shift rules and controls</p>
        </div>
        <a href="index.html" class="text-sm font-bold text-rose-600 uppercase">Floor</a>
    </header>
    <main id="ops-content" class="p-4 grid gap-3"></main>
    <div id="toast-wrap" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 bottom-4 space-y-2 z-[10000] pointer-events-none"></div>
    <script src="js/app.js"></script>
    <script src="js/ops.js"></script>
</body>
</html>
