<!-- /ticket.html -->
<!-- Agrega productos a la orden de una mesa y revisa su total. -->
<!-- Gives restaurant staff a clear, consistent workspace. -->
<!-- RELEVANT FILES: js/styles.css, js/app.js, js/ticket.js -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Agrega productos a la orden de una mesa y revisa su total.">
<title>Tomar orden | Taquería El Apá</title>
<script src="js/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">if (window.tailwind) tailwind.config = { darkMode: "class" };</script>
<link rel="stylesheet" href="js/styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f6f3">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body class="ticket-screen">
<header class="app-header ticket-header"><div class="app-container header-row">
<div class="ticket-heading"><a href="index.html" class="icon-button" aria-label="Volver a las mesas"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a><div class="ticket-title"><h1 id="table-name">Cargando…</h1><p id="table-meta">Preparando la orden</p></div></div>
<button id="commit-btn" class="button button-primary" type="button"><span>Guardar orden</span><span id="commit-total">$0.00</span></button>
</div></header>
<main class="app-container ticket-workspace" id="main">
<section aria-label="Productos del menú"><nav id="category-nav" class="category-tabs" aria-label="Categorías de productos"></nav><div id="product-grid"></div></section>
<footer class="order-tray" aria-label="Resumen de la orden">
<button id="tray-handle" type="button" aria-expanded="false" aria-controls="tray-list"><span><span class="material-symbols-outlined" aria-hidden="true">expand_less</span>Tu orden</span><span id="tray-count">0 productos</span></button>
<div id="tray-list" class="hidden"></div>
<div class="tray-total-row"><span>Total pendiente</span><span id="tray-total">$0.00</span></div>
</footer>
</main>
<div id="modifier-modal" class="modal-overlay hidden"><section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
<div class="dialog-heading"><h2 id="modal-title">Editar producto</h2><button id="modal-close" type="button" class="icon-button" aria-label="Cerrar"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
<div id="modal-options"></div>
<div class="quantity-control"><span>Cantidad</span><div class="quantity-buttons"><button id="modal-qty-minus" type="button" class="icon-button" aria-label="Reducir cantidad">−</button><span id="modal-qty-val">1</span><button id="modal-qty-plus" type="button" class="icon-button" aria-label="Aumentar cantidad">+</button></div></div>
<button id="modal-update-btn" type="button" class="button button-primary">Actualizar cantidad</button>
</section></div>
<div id="toast-wrap" aria-live="polite"></div>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/ticket.js"></script>
</body>
</html>
