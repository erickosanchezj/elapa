<!-- Administra las mesas y revisa las órdenes abiertas y cobradas. -->
<!-- Gives restaurant staff a clear, consistent workspace. -->
<!-- RELEVANT FILES: js/styles.css, js/app.js, js/floor.js -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Administra las mesas y revisa las órdenes abiertas y cobradas.">
<title>Mesas | Taquería El Apá</title>
<script src="js/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">if (window.tailwind) tailwind.config = { darkMode: "class" };</script>
<link rel="stylesheet" href="js/styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f6f3">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body class="floor-screen">
<header class="app-header">
<div class="app-container header-row"><a class="brand" href="index.html"><span class="material-symbols-outlined brand-mark" aria-hidden="true">restaurant</span><span>Taquería El Apá</span></a><div class="header-actions"><span class="header-note">Plano de mesas</span><button id="theme-toggle" class="icon-button" type="button" aria-label="Cambiar tema"><span id="theme-icon" class="material-symbols-outlined" aria-hidden="true">light_mode</span></button></div></div>
</header>
<div class="app-container">
<dl class="service-summary" aria-label="Resumen del servicio">
<div class="service-stat"><dt>Mesas con más de 1 h</dt><dd id="kpi-incidents">0</dd></div>
<div class="service-stat"><dt>Tiempo promedio</dt><dd id="kpi-sla">00:00</dd></div>
<div class="service-stat"><dt>Ventas de hoy</dt><dd id="kpi-sales">$0.00</dd></div>
</dl>
</div>
<main class="app-container page-content" id="main">
<div class="page-heading"><div><h1>Las mesas, al día.</h1><p>Abre una mesa para tomar su orden.</p></div><a class="link" href="precios.html">Precios <span class="material-symbols-outlined" aria-hidden="true">settings</span></a></div>
<div class="order-toolbar">
<div class="order-tabs" role="tablist" aria-label="Estado de las órdenes">
<button id="show-open-orders" class="order-view-tab active" type="button" role="tab" aria-selected="true" aria-controls="floor-grid">Abiertas <span id="open-orders-count" class="tab-count">0</span></button>
<button id="show-closed-orders" class="order-view-tab" type="button" role="tab" aria-selected="false" aria-controls="floor-grid">Cobradas <span id="closed-orders-count" class="tab-count">0</span></button>
</div>
<div><button id="fab-add-table" class="button button-primary" type="button"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Abrir mesa</span></button></div>
</div>
<div id="floor-grid" aria-label="Mesas del restaurante"></div>
<noscript><p>Activa JavaScript para administrar las mesas. Los datos se guardan en este dispositivo.</p></noscript>
</main>
<nav class="bottom-nav" aria-label="Navegación principal"><div class="bottom-nav-inner"><a class="nav-link" href="index.html" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span><span>Mesas</span></a><a class="nav-link" href="ticket.html"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span><span>Tickets</span></a><a class="nav-link" href="precios.html"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span>Precios</span></a><a class="nav-link" href="menu.html"><span class="material-symbols-outlined" aria-hidden="true">menu_book</span><span>Menú</span></a><a class="nav-link" href="#" aria-disabled="true" tabindex="-1" title="Sin conexión configurada"><span class="material-symbols-outlined" aria-hidden="true">monitor</span><span>KDS</span></a><a class="nav-link" href="#" aria-disabled="true" tabindex="-1" title="Sin conexión configurada"><span class="material-symbols-outlined" aria-hidden="true">layers</span><span>Trompo</span></a></div></nav>
<div id="toast-wrap" aria-live="polite"></div>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/floor.js"></script>
</body>
</html>
